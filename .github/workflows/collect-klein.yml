name: Collect complete Klein dictionary
on:
  push:
    branches: [main]
    paths: ['.github/workflows/collect-klein.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: klein-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Collect and checkpoint original Klein definitions
        run: python -u scripts/web/collect_klein.py
