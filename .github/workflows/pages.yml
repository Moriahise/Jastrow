name: Build and publish Beit haMillon
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Collect complete Klein dictionary"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore verified public dictionary snapshots
        uses: actions/cache@v4
        with:
          path: .build/data-upstream
          key: lexicons-${{ hashFiles('scripts/web/upstream-pins.json') }}
      - name: Prepare original files and pinned dictionaries
        run: python scripts/web/prepare_inputs.py
      - name: Build searchable independent collection
        run: python scripts/web/build_data.py
      - name: Verify every original file and dictionary record
        run: python scripts/web/verify_data.py
      - name: Test search and backup validation
        run: node --test tests/search.test.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy verified website
        id: deployment
        uses: actions/deploy-pages@v4
